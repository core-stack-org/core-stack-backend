purpose: Build and maintain a lean pan-India facilities geospatial asset from raw facility files.

source_of_truth:
  raw_files: data/facilities/raw/
  operational_config: utilities/scripts/facilities_utils/config/facilities_master.yaml
  reference_files:
    - data/facilities/reference/india_pincodes_centroid.csv

main_outputs:
  facilities_gpkg: data/facilities/outputs/pan_india_facilities.gpkg
  proximity_gpkg: data/facilities/outputs/cs_village_facility_proximity.gpkg
  audit_state: data/facilities/state/pipeline_state.json

facility_gpkg_structure:
  facilities:
    description: One point per valid physical facility.
    keep_columns:
      - facility_uid
      - latitude
      - longitude
      - facility_name
      - facility_code
      - class_l1_domain
      - class_l2_filter_group
      - class_l3_facility_class
      - class_l4_facility_subtype
      - class_k1 to class_k8
      - urban_rural
      - pincode
      - establishment_year
      - district_lgd
      - village_census11
      - village_name
      - membership_count
    intentionally_not_kept:
      - source dataset/file columns
      - coordinate_status, because only valid points are exported
      - repeated list columns
      - redundant management/ownership/type columns when held in class_k fields
  facility_memberships:
    description: Non-spatial table that records every class membership for each facility.
  facility_taxonomy:
    description: Non-spatial table describing domain, filter group, facility class, subtype level, and filter logic.
  source_summary:
    description: Non-spatial build QA table.
  invalid_coordinates:
    description: Non-spatial invalid coordinate records for audit.

proximity_gpkg_structure:
  village_shapes:
    description: Actual village polygons from cs_admin_standard with representative-point latitude/longitude helper columns.
  proximity_l3:
    description: Lean durable base table with village id, L3 facility class, nearest distance, and nearest facility uid.
    intentionally_not_kept:
      - class_l1_domain, because it is regenerated from proximity_class_map
      - class_l2_filter_group, because it is regenerated from proximity_class_map
      - repeated village context columns, because they are stored once in village_shapes
      - repeated facility detail columns, because they are stored once in proximity_nearest_facilities
  proximity_nearest_facilities:
    description: Deduplicated details for facilities referenced by proximity_l3.
  proximity_class_map:
    description: Small autogenerated table from facilities_master.yaml mapping L3 classes to L2, L1, and filter_logic.
  proximity_l2_materialized:
    description: Lean physical L2 table derived from proximity_l3 using configured min/max filter logic; used directly by API exports.
    intentionally_not_kept:
      - repeated village context columns, because they are stored once in village_shapes
      - repeated facility detail columns, because they are joined from proximity_nearest_facilities during tehsil export
  proximity_l2:
    description: Optional SQL view derived from proximity_l3 plus proximity_class_map for inspection.
  proximity_l1:
    description: Optional view only; L1/domain proximity is not part of the default export path.
  materialized_derived_tables:
    description: L1/L2 physical tables kept for API export and frontend performance; SQL views are also retained as rebuildable derivations.

proximity_policy:
  stored_level: class_l3_facility_class
  not_traversed_for_nearest_search: class_l4_facility_subtype
  reason: L3 classes already cover all facilities; L4 is retained as nearest-facility metadata.
  incremental_update:
    - Compute or recompute affected L3 classes.
    - Refresh proximity_class_map and L2/L1 derived views from YAML after all configured L3 classes are complete.
    - Materialize L2/L1 for the API/GeoServer source asset.

adding_a_dataset:
  steps:
    - Put raw file or folder under data/facilities/raw/.
    - Copy utilities/scripts/facilities_utils/config/new_dataset_schema_template.yaml and fill the required fields.
    - Add the completed source block to sources in utilities/scripts/facilities_utils/config/facilities_master.yaml.
    - Add or confirm taxonomy class under taxonomy in the same master config.
    - Add simple source-specific mappings under mappings if they are short and human-editable.
    - Run the pipeline for the source, then rebuild the GPKG.
  minimum_required_fields:
    - active
    - processor
    - raw_files
    - facility_class or class mapping
    - id_col
    - lat_col
    - lon_col
  optional_fields:
    - name_col
    - subtype_col
    - facility_code_col
    - urban_rural_col
    - pincode_col
    - establishment_year_col
    - district_lgd_col
    - village_census11_col
    - village_name_col
    - class_k
