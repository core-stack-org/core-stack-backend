# Per-tehsil outputs written by local compute.
#
# local_path: where the layer is written. Vector layers live under
#     {state}/{district}/{block}/{filename} (state/district/block are slugged
#     with valid_gee_text, lower case). The part before the first "{...}"
#     placeholder after {DATA_DIR} is the output base dir used by
#     computing/config_loader.py.
# geoserver_workspace / geoserver_layer: the GeoServer workspace and layer
#     name template the local output is published as (they match
#     stats_generator.LayerInfo.workspace / layer_name). The local stats-excel
#     generator uses these to find the local file for each LayerInfo row.
#     Entries without a local_path are not generated locally (GEE only).
# per_year: one file per year, named {filename} with {year} filled in.
derived_layers:
    - name: generate_mws_layer
      filename: "filtered_mws_{district}_{block}_uid.geojson"
      local_path: "{DATA_DIR}/base_layers/tehsil_mws/{state}/{district}/{block}/{filename}"
      geoserver_workspace: mws
      geoserver_layer: "mws_{district}_{block}"
      layer_type: vector

    - name: lulc v3
      filename: "{district}_{block}_{start_year}-07-01_{end_year}-06-30_LULCmap_10m.tif"
      local_path: "{DATA_DIR}/lulc/lulc_v3_local/{state}/{district}/{block}/{filename}"
      geoserver_workspace: LULC_v3
      layer_type: raster

    - name: lulc v4

    - name: generate_ci_layer

    - name: generate_terrain_raster

    - name: generate_terrain_descriptor
      aliases:
          - terrain clusters
      filename: "{district}_{block}_cluster.gpkg"
      local_path: "{DATA_DIR}/terrain/terrain_clusters_local/{state}/{district}/{block}/{filename}"
      geoserver_workspace: terrain
      geoserver_layer: "{district}_{block}_cluster"
      layer_type: vector

    - name: terrain_lulc_slope_cluster
