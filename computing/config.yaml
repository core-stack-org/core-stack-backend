          - lulc slope clusters
      filename: "{district}_{block}_lulc_slope.gpkg"
      local_path: "{DATA_DIR}/lulc_X_terrain/lulc_slope_clusters_local/{state}/{district}/{block}/{filename}"
      geoserver_workspace: terrain_lulc
      geoserver_layer: "{district}_{block}_lulc_slope"
      layer_type: vector

    - name: terrain_lulc_plain_cluster
