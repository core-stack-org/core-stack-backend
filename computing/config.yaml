      geoserver_workspace: change_detection
      layer_type: raster

    - name: change detection vector
      params:
          [
              Afforestation,
              Deforestation,
              Degradation,
              Urbanization,
              CropIntensity,
              ShrubChange,
          ]
      filename: change_vector_{district}_{block}_{param_name}_{start_year}_{end_year}.gpkg
      local_path: "{DATA_DIR}/change_detection/change_detection_vector_local/{state}/{district}/{block}/{filename}"
      geoserver_workspace: change_detection
      geoserver_layer: "change_vector_{district}_{block}_{param_name}"
