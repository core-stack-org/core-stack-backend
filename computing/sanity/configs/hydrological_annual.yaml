layer_name: hydrological_annual
sheet_names:
  - hydrological_annual

rules:
  # Source: STAC Annual water balance / change in well depth vector table:columns.
  - name: hydrological_annual_uid_not_null
    applies_to: [excel, vector]
    type: not_null
    field_pattern: "*uid*"

  - name: hydrological_annual_schema_present
    applies_to: [excel, vector]
    type: required_any_field_pattern
    value:
      - "ET_in_mm_*"
      - "RunOff_in_mm_*"
      - "Precipitation_in_mm_*"
      - "Net*"

  - name: hydrological_annual_numeric_type
    applies_to: [excel, vector]
    type: data_type
    field_pattern: "*"
    expected_type: numeric
    exclude_field_patterns:
      - "*uid*"
      - "id"
      - "geometry"
    allow_missing_fields: true

  - name: hydrological_annual_area_min
    applies_to: [excel, vector]
    type: min_value
    field_pattern: "*area*"
    value: 0
    allow_missing_fields: true
