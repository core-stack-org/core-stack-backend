layer_name: terrain_lulc_slope
sheet_names:
  - terrain_lulc_slope

rules:
  # Source: terrain and LULC cross-tab stats-generator export.
  - name: terrain_lulc_slope_uid_not_null
    type: not_null
    field_pattern: "*uid*"

  - name: terrain_lulc_slope_schema_present
    type: required_any_field_pattern
    value:
      - "terrain_cluster_id"
      - "*_area_percent"

  - name: terrain_lulc_slope_percent_min
    type: min_value
    field_pattern: "*_area_percent"
    value: 0

  - name: terrain_lulc_slope_percent_max
    type: max_value
    field_pattern: "*_area_percent"
    value: 100
