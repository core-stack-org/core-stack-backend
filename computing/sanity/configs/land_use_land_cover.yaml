layer_name: land_use_land_cover
sheet_names:
  - lulc_vector

rules:
  # Source: STAC Land Use Land Cover vector table:columns.
  # Pipeline: computing/lulc/lulc_vector*.py writes <class>_area_<year> in ha
  # per MWS; stats_generator renames them to <class>_area_in_ha_<year>. The
  # patterns below match both forms.
  - name: lulc_uid_not_null
    applies_to: [excel, vector]
    type: not_null
    field_pattern: "*uid*"

  # Every LULC export must carry the MWS area and the main class families.
  - name: lulc_mws_area_present
    applies_to: [excel, vector]
    type: required_any_field_pattern
    value:
      - "area_in_ha"

  - name: lulc_built_up_present
    applies_to: [excel, vector]
    type: required_any_field_pattern
    value:
      - "built-up_area_*"

  - name: lulc_water_present
    applies_to: [excel, vector]
    type: required_any_field_pattern
    value:
      - "k_water_area_*"
      - "kr_water_area_*"
      - "krz_water_area_*"

  - name: lulc_tree_forest_present
    applies_to: [excel, vector]
    type: required_any_field_pattern
    value:
      - "tree_forest_area_*"

  - name: lulc_barrenlands_present
    applies_to: [excel, vector]
    type: required_any_field_pattern
    value:
      - "barrenlands_area_*"

  - name: lulc_shrub_scrub_present
    applies_to: [excel, vector]
    type: required_any_field_pattern
    value:
      - "shrub_scrub_area_*"

  - name: lulc_cropped_present
    applies_to: [excel, vector]
    type: required_any_field_pattern
    value:
      - "single_kharif_cropped_area_*"
      - "single_non_kharif_cropped_area_*"
      - "doubly_cropped_area_*"
      - "triply_cropped_area_*"

  # All area fields (MWS area and per-class areas) are numeric hectares,
  # never negative, and never null (Excel writes None for a missing year).
  # Only *area* columns are checked: MWS code leftovers (bacode, sbcode,
  # wsconc) are strings and the GEE reducer leftover `sum` is not an area.
  - name: lulc_area_numeric_type
    applies_to: [excel, vector]
    type: data_type
    field_pattern: "*area*"
    expected_type: numeric

  - name: lulc_area_not_null
    applies_to: [excel, vector]
    type: not_null
    field_pattern: "*area*"

  - name: lulc_area_min
    applies_to: [excel, vector]
    type: min_value
    field_pattern: "*area*"
    value: 0

  # Pair: the sheet must cover the same MWS as the vector it summarises.
  # A mismatch means the sheet was built from an older generation of the layer.
  - name: land_use_land_cover_pair_id_coverage
    applies_to: [pair]
    type: id_coverage

  # The 11 classes partition the MWS (cropland is the sum of the four crop
  # classes, so it is left out), so they must add up to area_in_ha.
  - name: lulc_excel_classes_sum_to_area
    applies_to: [excel]
    type: expression
    suffix_from: "barrenlands_area_in_ha_{year}"
    value: "abs(`built-up_area_in_ha_{year}` + k_water_area_in_ha_{year} + kr_water_area_in_ha_{year} + krz_water_area_in_ha_{year} + tree_forest_area_in_ha_{year} + barrenlands_area_in_ha_{year} + shrub_scrub_area_in_ha_{year} + single_kharif_cropped_area_in_ha_{year} + single_non_kharif_cropped_area_in_ha_{year} + doubly_cropped_area_in_ha_{year} + triply_cropped_area_in_ha_{year} - area_in_ha) <= 0.02 * area_in_ha"

  - name: lulc_vector_classes_sum_to_area
    applies_to: [vector]
    type: expression
    suffix_from: "barrenlands_area_{year}"
    value: "abs(`built-up_area_{year}` + k_water_area_{year} + kr_water_area_{year} + krz_water_area_{year} + tree_forest_area_{year} + barrenlands_area_{year} + shrub_scrub_area_{year} + single_kharif_cropped_area_{year} + single_non_kharif_cropped_area_{year} + doubly_cropped_area_{year} + triply_cropped_area_{year} - area_in_ha) <= 0.02 * area_in_ha"

  - name: lulc_pair_fields_match
    applies_to: [pair]
    type: field_match
    value:
      - {vector: area_in_ha, excel: area_in_ha, tolerance: 0.01}
