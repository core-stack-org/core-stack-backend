layer_name: dem
sheet_names:
  - dem

rules:
  # Source: Pan India STAC terrain DEM items and stats-generator DEM export.
  # Every MWS row needs its identifier in both forms.
  - name: dem_uid_not_null
    applies_to: [excel, vector]
    type: not_null
    field_pattern: "*uid*"

  # Vector: digital_elevation_model(_local).py writes min/max/mean_elevation (metres).
  - name: dem_vector_schema_present
    applies_to: [vector]
    type: required_fields
    value:
      - min_elevation
      - max_elevation
      - mean_elevation

  - name: dem_vector_elevation_not_null
    applies_to: [vector]
    type: not_null
    field_pattern: "*_elevation"

  - name: dem_vector_elevation_type
    applies_to: [vector]
    type: data_type
    field_pattern: "*_elevation"
    expected_type: numeric

  # India spans roughly sea level to 8,600 m; allow margin for DEM noise.
  - name: dem_vector_elevation_reasonable_min
    applies_to: [vector]
    type: min_value
    field_pattern: "*_elevation"
    value: -500

  - name: dem_vector_elevation_reasonable_max
    applies_to: [vector]
    type: max_value
    field_pattern: "*_elevation"
    value: 9000

  # Excel: the export renames the vector fields to *_elevation_in_m and writes
  # "" when a vector field is missing, so nulls here mean missing source values.
  - name: dem_excel_schema_present
    applies_to: [excel]
    type: required_fields
    value:
      - min_elevation_in_m
      - max_elevation_in_m
      - mean_elevation_in_m

  - name: dem_excel_elevation_not_null
    applies_to: [excel]
    type: not_null
    field_pattern: "*_elevation_in_m"

  - name: dem_excel_elevation_type
    applies_to: [excel]
    type: data_type
    field_pattern: "*_elevation_in_m"
    expected_type: numeric

  - name: dem_excel_elevation_reasonable_min
    applies_to: [excel]
    type: min_value
    field_pattern: "*_elevation_in_m"
    value: -500

  - name: dem_excel_elevation_reasonable_max
    applies_to: [excel]
    type: max_value
    field_pattern: "*_elevation_in_m"
    value: 9000
