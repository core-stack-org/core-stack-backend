layer_name: dem
sheet_names:
  - dem

rules:
  # Source: Pan India STAC terrain DEM items and stats-generator DEM export.
  - name: dem_uid_not_null
    type: not_null
    field_pattern: "*uid*"

  - name: dem_schema_present
    type: required_any_field_pattern
    value:
      - "min_elevation_in_m"
      - "max_elevation_in_m"
      - "mean_elevation_in_m"

  - name: dem_elevation_type
    type: data_type
    field_pattern: "*elevation_in_m"
    expected_type: numeric

  - name: dem_elevation_reasonable_min
    type: min_value
    field_pattern: "*elevation_in_m"
    value: -500

  - name: dem_elevation_reasonable_max
    type: max_value
    field_pattern: "*elevation_in_m"
    value: 9000
