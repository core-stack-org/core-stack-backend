layer_name: change_detection_deforestation
sheet_names:
  - change_detection_deforestation

rules:
  # Common identifier check. Vector uses uid; Excel export uses UID.
  - name: deforestation_uid_not_null
    type: not_null
    field_pattern: "*uid*"
    applies_to: [excel, vector]

  # Vector schema from STAC Land Use Change: Loss of tree cover table:columns.
  # Labels are fixed in change_detection_vector(_local).py, so every one is
  # required: a layer missing one class would otherwise pass.
  - name: deforestation_vector_schema_present
    type: required_fields
    value:
      - "fo_ba"
      - "fo_bu"
      - "fo_fa"
      - "fo_fo"
      - "fo_sc"
      - "total_def"
    applies_to: [vector]

  # Excel schema from stats-generator change_detection_deforestation sheet.
  # The export writes every column even when the vector lacks the source
  # field (properties.get(..., None)), so the Excel not-null check below is
  # what catches a missing vector class here.
  - name: deforestation_excel_schema_present
    type: required_fields
    value:
      - "forest_to_barren_area_in_ha"
      - "forest_to_built_up_area_in_ha"
      - "forest_to_farm_area_in_ha"
      - "forest_to_forest_area_in_ha"
      - "forest_to_scrub_land_area_in_ha"
      - "total_deforestation_area_in_ha"
    applies_to: [excel]

  # Vector area fields, listed explicitly: MWS layers in some states also carry
  # watershed code strings (bacode, sbcode, wsconc) that are not areas.
  # Areas are hectares (pixelArea * 0.0001), so never negative.
  - name: deforestation_vector_numeric_type
    type: data_type
    fields:
      - "area_in_ha"
      - "fo_ba"
      - "fo_bu"
      - "fo_fa"
      - "fo_fo"
      - "fo_sc"
      - "total_def"
    expected_type: numeric
    allow_missing_fields: true
    applies_to: [vector]

  - name: deforestation_vector_area_not_null
    type: not_null
    fields:
      - "area_in_ha"
      - "fo_ba"
      - "fo_bu"
      - "fo_fa"
      - "fo_fo"
      - "fo_sc"
      - "total_def"
    allow_missing_fields: true
    applies_to: [vector]

  - name: deforestation_vector_area_min
    type: min_value
    fields:
      - "area_in_ha"
      - "fo_ba"
      - "fo_bu"
      - "fo_fa"
      - "fo_fo"
      - "fo_sc"
      - "total_def"
    value: 0
    allow_missing_fields: true
    applies_to: [vector]

  # Excel area fields, including the MWS area_in_ha.
  - name: deforestation_excel_numeric_type
    type: data_type
    field_pattern: "*area_in_ha"
    expected_type: numeric
    applies_to: [excel]

  - name: deforestation_excel_area_not_null
    type: not_null
    field_pattern: "*area_in_ha"
    applies_to: [excel]

  - name: deforestation_excel_area_min
    type: min_value
    field_pattern: "*area_in_ha"
    value: 0
    applies_to: [excel]
