layer_name: change_detection_deforestation
sheet_names:
  - change_detection_deforestation

rules:
  # Common identifier check. Vector uses uid; Excel export uses UID.
  - name: deforestation_uid_not_null
    type: not_null
    field_pattern: "*uid*"
    applies_to: [excel, vector]

  # Vector schema from STAC Land Use Change: Loss of tree cover table:columns.
  - name: deforestation_vector_schema_present
    type: required_any_field_pattern
    value:
      - "fo_ba"
      - "fo_bu"
      - "fo_fa"
      - "fo_fo"
      - "fo_sc"
      - "total_def"
    applies_to: [vector]

  # Excel schema from stats-generator change_detection_deforestation sheet.
  - name: deforestation_excel_schema_present
    type: required_any_field_pattern
    value:
      - "forest_to_barren_area_in_ha"
      - "forest_to_built_up_area_in_ha"
      - "forest_to_farm_area_in_ha"
      - "forest_to_forest_area_in_ha"
      - "forest_to_scrub_land_area_in_ha"
      - "total_deforestation_area_in_ha"
    applies_to: [excel]

  - name: deforestation_vector_numeric_type
    type: data_type
    field_pattern: "*"
    expected_type: numeric
    exclude_field_patterns: ["*uid*", "the_geom", "geometry"]
    allow_missing_fields: true
    applies_to: [vector]

  - name: deforestation_excel_numeric_type
    type: data_type
    field_pattern: "*_area_in_ha"
    expected_type: numeric
    allow_missing_fields: true
    applies_to: [excel]

  - name: deforestation_vector_area_min
    type: min_value
    field_pattern: "*"
    value: 0
    exclude_field_patterns: ["*uid*", "the_geom", "geometry"]
    allow_missing_fields: true
    applies_to: [vector]

  - name: deforestation_excel_area_min
    type: min_value
    field_pattern: "*_area_in_ha"
    value: 0
    allow_missing_fields: true
    applies_to: [excel]
