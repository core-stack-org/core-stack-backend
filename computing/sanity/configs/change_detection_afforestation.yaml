layer_name: change_detection_afforestation
sheet_names:
  - change_detection_afforestation

rules:
  # Common identifier check. Vector uses uid; Excel export uses UID.
  - name: afforestation_uid_not_null
    type: not_null
    field_pattern: "*uid*"
    applies_to: [excel, vector]

  # Vector schema from STAC Land Use Change: Tree cover gain table:columns.
  # Labels are fixed in change_detection_vector(_local).py, so every one is
  # required: a layer missing one class would otherwise pass.
  - name: afforestation_vector_schema_present
    type: required_fields
    value:
      - "ba_fo"
      - "bu_fo"
      - "fa_fo"
      - "fo_fo"
      - "sc_fo"
      - "total_aff"
    applies_to: [vector]

  # Excel schema from stats-generator change_detection_afforestation sheet.
  # The export writes every column even when the vector lacks the source
  # field (properties.get(..., None)), so the Excel not-null check below is
  # what catches a missing vector class here.
  - name: afforestation_excel_schema_present
    type: required_fields
    value:
      - "barren_to_forest_area_in_ha"
      - "built_up_to_forest_area_in_ha"
      - "farm_to_forest_area_in_ha"
      - "forest_to_forest_area_in_ha"
      - "scrub_land_to_forest_area_in_ha"
      - "total_afforestation_area_in_ha"
    applies_to: [excel]

  # Vector area fields, listed explicitly: MWS layers in some states also carry
  # watershed code strings (bacode, sbcode, wsconc) that are not areas.
  # Areas are hectares (pixelArea * 0.0001), so never negative.
  - name: afforestation_vector_numeric_type
    type: data_type
    fields:
      - "area_in_ha"
      - "ba_fo"
      - "bu_fo"
      - "fa_fo"
      - "fo_fo"
      - "sc_fo"
      - "total_aff"
    expected_type: numeric
    allow_missing_fields: true
    applies_to: [vector]

  - name: afforestation_vector_area_not_null
    type: not_null
    fields:
      - "area_in_ha"
      - "ba_fo"
      - "bu_fo"
      - "fa_fo"
      - "fo_fo"
      - "sc_fo"
      - "total_aff"
    allow_missing_fields: true
    applies_to: [vector]

  - name: afforestation_vector_area_min
    type: min_value
    fields:
      - "area_in_ha"
      - "ba_fo"
      - "bu_fo"
      - "fa_fo"
      - "fo_fo"
      - "sc_fo"
      - "total_aff"
    value: 0
    allow_missing_fields: true
    applies_to: [vector]

  # Excel area fields, including the MWS area_in_ha.
  - name: afforestation_excel_numeric_type
    type: data_type
    field_pattern: "*area_in_ha"
    expected_type: numeric
    applies_to: [excel]

  - name: afforestation_excel_area_not_null
    type: not_null
    field_pattern: "*area_in_ha"
    applies_to: [excel]

  - name: afforestation_excel_area_min
    type: min_value
    field_pattern: "*area_in_ha"
    value: 0
    applies_to: [excel]
