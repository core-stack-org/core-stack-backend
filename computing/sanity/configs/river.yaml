layer_name: river
sheet_names:
  - river

rules:
  # Source: Pan India STAC drainage/river vector metadata.
  - name: river_uid_not_null
    applies_to: [excel, vector]
    type: not_null
    field_pattern: "*uid*"

  - name: river_name_not_null
    applies_to: [excel, vector]
    type: not_null
    field: river_name
