layer_name: hydrological_seasonal
sheet_names:
  - hydrological_seasonal

rules:
  # Source: STAC Water balance fortnightly vector table:columns.
  - name: hydrological_seasonal_uid_not_null
    type: not_null
    field_pattern: "*uid*"

  - name: hydrological_seasonal_schema_present
    type: required_any_field_pattern
    value:
      - "precipitation_*"
      - "runoff_*"
      - "et_*"
      - "delta g_*"

  - name: hydrological_seasonal_numeric_type
    type: data_type
    field_pattern: "*"
    expected_type: numeric
    exclude_field_patterns:
      - "*uid*"
      - "id"
      - "geometry"
    allow_missing_fields: true

  - name: hydrological_seasonal_area_min
    type: min_value
    field_pattern: "*area*"
    value: 0
    allow_missing_fields: true
