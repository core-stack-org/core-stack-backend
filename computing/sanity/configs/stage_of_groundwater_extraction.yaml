layer_name: stage_of_groundwater_extraction
sheet_names:
  - soge_vector

rules:
  # Source: soge_vector_<district>_<tehsil>[_<year>] layers
  # (computing/misc/soge_vector*.py) and the stats_generator soge_vector sheet.
  # The pipeline writes -9999 for every quantity when an MWS has no SOGE
  # polygon ("No Data") or the source year lacks a column, so quantity bounds
  # can only reject values below that sentinel.
  - name: soge_uid_not_null
    applies_to: [excel, vector]
    type: not_null
    field_pattern: "*uid*"

  # Vector: raw CGWB attribute names (shapefile-truncated, e.g. sgw_dev_pe).
  - name: soge_vector_percent_present
    applies_to: [vector]
    type: required_any_field_pattern
    value:
      - "sgw_dev_pe"

  - name: soge_vector_class_present
    applies_to: [vector]
    type: required_any_field_pattern
    value:
      - "class"

  # Numeric CGWB quantities and overlap stats. "code" is excluded: it is the
  # numeric class code in older layers but an admin code string ("JH050600")
  # in the 2025 layers.
  - name: soge_vector_numeric_type
    applies_to: [vector]
    type: data_type
    field_pattern: "*"
    expected_type: numeric
    exclude_field_patterns:
      - "*uid*"
      - "geometry"
      - "class"
      - "code"
      - "sbcode"
      - "bacode"
      - "wsconc"
      - "soge_block"
      - "soge_district"
      - "soge_state"
      - "soge_tehsil"
    allow_missing_fields: true

  - name: soge_vector_quantities_min
    applies_to: [vector]
    type: min_value
    field_pattern: "*"
    value: -9999
    exclude_field_patterns:
      - "*uid*"
      - "geometry"
      - "class"
      - "code"
      - "sbcode"
      - "bacode"
      - "wsconc"
      - "soge_block"
      - "soge_district"
      - "soge_state"
      - "soge_tehsil"
    allow_missing_fields: true

  # Overlap stats are filled with 0 (not -9999) for No Data, so they are strict.
  - name: soge_vector_area_min
    applies_to: [vector]
    type: min_value
    field_pattern: "*area*"
    value: 0
    allow_missing_fields: true

  - name: soge_vector_pct_area_max
    applies_to: [vector]
    type: max_value
    fields: [pct_area_soge]
    value: 100
    allow_missing_fields: true

  - name: soge_vector_class_allowed
    applies_to: [vector]
    type: allowed_values
    field_pattern: "class"
    value: [Safe, Semi-Critical, Critical, Over Exploited, Saline, Not Assessed, No Data]
    allow_missing_fields: true

  # Excel: one block of columns per SOGE assessment year
  # (soge_dev_percent_2011, class_name_2011, *_in_bcm_2011, ...). The patterns
  # also match the older unsuffixed export (soge_dev_percent, class_name).
  - name: soge_excel_percent_present
    applies_to: [excel]
    type: required_any_field_pattern
    value:
      - "soge_dev_percent*"

  - name: soge_excel_class_present
    applies_to: [excel]
    type: required_any_field_pattern
    value:
      - "class_name*"

  - name: soge_excel_numeric_type
    applies_to: [excel]
    type: data_type
    field_pattern: "*"
    expected_type: numeric
    exclude_field_patterns:
      - "*uid*"
      - "class_name*"
    allow_missing_fields: true

  - name: soge_excel_percent_min
    applies_to: [excel]
    type: min_value
    field_pattern: "soge_dev_percent*"
    value: 0
    ignore_values: [-9999]
    allow_missing_fields: true

  - name: soge_excel_quantities_min
    applies_to: [excel]
    type: min_value
    field_pattern: "*_in_bcm*"
    value: 0
    ignore_values: [-9999]
    allow_missing_fields: true

  - name: soge_excel_area_min
    applies_to: [excel]
    type: min_value
    fields: [area_in_ha]
    value: 0
    allow_missing_fields: true

  - name: soge_excel_class_allowed
    applies_to: [excel]
    type: allowed_values
    field_pattern: "class_name*"
    value: [Safe, Semi-Critical, Critical, Over Exploited, Saline, Not Assessed, No Data]
    allow_missing_fields: true

  # Pair: the sheet must cover the same MWS as the vector it summarises.
  # A mismatch means the sheet was built from an older generation of the layer.
  - name: stage_of_groundwater_extraction_pair_id_coverage
    applies_to: [pair]
    type: id_coverage

  # Units: a block's annual recharge or extraction is far below 50 billion m3
  # (all of India recharges a few hundred). Larger values mean the column is
  # in another unit (CGWB reports hectare-metres).
  - name: soge_excel_quantities_unit_scale
    applies_to: [excel]
    type: max_value
    field_pattern: "*_in_bcm*"
    value: 50
    allow_missing_fields: true

  # -9999 is the no-data value for an MWS without a SOGE block. A column that
  # is mostly -9999 means the source year lacks that quantity; the export
  # should drop it instead of averaging the sentinel.
  - name: soge_excel_quantities_mostly_present
    applies_to: [excel]
    type: max_null_fraction
    field_pattern: "*_in_bcm*"
    value: 0.5
    ignore_values: [-9999]
    allow_missing_fields: true

  # CGWB arithmetic, checked per assessment year (rows with -9999 skipped).
  - name: soge_excel_total_extraction_sum
    applies_to: [excel]
    type: expression
    suffix_from: "total_extraction_in_bcm_{year}"
    value: "abs(total_extraction_in_bcm_{year} - (extraction_for_irrigation_in_bcm_{year} + extraction_for_domestic_and_industrial_in_bcm_{year})) <= 0.02 * total_extraction_in_bcm_{year}"
    ignore_values: [-9999]

  - name: soge_excel_availability_is_recharge_minus_discharge
    applies_to: [excel]
    type: expression
    suffix_from: "groundwater_availability_in_bcm_{year}"
    value: "abs(groundwater_availability_in_bcm_{year} - (groundwater_recharge_in_bcm_{year} - natural_discharge_in_bcm_{year})) <= 0.02 * groundwater_availability_in_bcm_{year}"
    ignore_values: [-9999]

  - name: soge_excel_availability_le_recharge
    applies_to: [excel]
    type: expression
    suffix_from: "groundwater_availability_in_bcm_{year}"
    value: "groundwater_availability_in_bcm_{year} <= groundwater_recharge_in_bcm_{year}"
    ignore_values: [-9999]

  - name: soge_excel_stage_is_extraction_over_availability
    applies_to: [excel]
    type: expression
    suffix_from: "soge_dev_percent_{year}"
    value: "abs(soge_dev_percent_{year} - 100 * total_extraction_in_bcm_{year} / groundwater_availability_in_bcm_{year}) <= 1"
    ignore_values: [-9999]

  # Classes follow the stage % only from the GEC-2015 method (2017 onwards);
  # earlier assessments also weighed water-level trends.
  - name: soge_excel_safe_class_matches_stage
    applies_to: [excel]
    type: expression
    suffix_from: "class_name_{year}"
    suffix_min: 2017
    value: "(class_name_{year} == 'Safe') == (soge_dev_percent_{year} <= 70)"
    ignore_values: [-9999]
