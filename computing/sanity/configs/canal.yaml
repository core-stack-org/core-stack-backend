layer_name: canal
sheet_names:
  - canal

rules:
  # Source: Pan India STAC drainage/irrigation-adjacent vector metadata.
  # One row per MWS x canal segment, so uids repeat; segments outside every MWS
  # get uid "" (not null) by design in canal_local_compute.py.
  - name: canal_uid_not_null
    applies_to: [excel, vector]
    type: not_null
    field_pattern: "*uid*"

  # Vector keeps the source WRIS field names: project name, canal code and
  # canal name. Blank values are stored as "", which not_null can't see.
  - name: canal_vector_schema_present
    applies_to: [vector]
    type: required_fields
    value:
      - prjname
      - cancode
      - canname

  - name: canal_vector_identity_not_null
    applies_to: [vector]
    type: not_null
    fields:
      - prjname
      - cancode
      - canname

  # Excel: the export renames them to project_name, canal_code and canal_name;
  # blank values read back as null.
  - name: canal_excel_schema_present
    applies_to: [excel]
    type: required_fields
    value:
      - project_name
      - canal_code
      - canal_name

  - name: canal_excel_identity_not_null
    applies_to: [excel]
    type: not_null
    fields:
      - project_name
      - canal_code
      - canal_name
