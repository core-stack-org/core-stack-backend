layer_name: drought_frequency
sheet_names:
  - croppingDrought_kharif

rules:
  # Source: STAC Drought frequency vector table:columns.
  - name: drought_uid_not_null
    type: not_null
    field_pattern: "*uid*"

  - name: drought_schema_present
    type: required_any_field_pattern
    value:
      - "drlb_*"
      - "No_Drought_in_weeks_*"
      - "Mild_in_weeks_*"

  - name: drought_numeric_type
    type: data_type
    field_pattern: "*"
    expected_type: numeric
    exclude_field_patterns:
      - "*uid*"
      - "id"
      - "drlb_*"
      - "m_ons_*"
      - "monsoon_onset_*"
      - "geometry"
    allow_missing_fields: true

  - name: drought_non_negative
    type: min_value
    field_pattern: "*"
    value: 0
    exclude_field_patterns:
      - "*uid*"
      - "id"
      - "drlb_*"
      - "m_ons_*"
      - "monsoon_onset_*"
      - "rd*"
      - "geometry"
    allow_missing_fields: true

  - name: drought_percent_max
    type: max_value
    field_pattern: "*percent*"
    value: 100
    allow_missing_fields: true
