layer_name: change_detection_degradation
sheet_names:
  - change_detection_degradation

rules:
  # Source: STAC Land Use Change: Cropping reduction vector table:columns.
  - name: degradation_uid_not_null
    type: not_null
    field_pattern: "*uid*"

  - name: degradation_schema_present
    type: required_any_field_pattern
    value:
      - "total_deg*"
      - "total_degradation_area_in_ha"

  - name: degradation_numeric_type
    type: data_type
    field_pattern: "*"
    expected_type: numeric
    exclude_field_patterns:
      - "*uid*"
      - "the_geom"
      - "geometry"
    allow_missing_fields: true

  - name: degradation_area_min
    type: min_value
    field_pattern: "*"
    value: 0
    exclude_field_patterns:
      - "*uid*"
      - "the_geom"
      - "geometry"
    allow_missing_fields: true
