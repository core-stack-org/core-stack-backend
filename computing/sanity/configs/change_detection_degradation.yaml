layer_name: change_detection_degradation
sheet_names:
  - change_detection_degradation

rules:
  # Common identifier check. Vector uses uid; Excel export uses UID.
  - name: degradation_uid_not_null
    type: not_null
    field_pattern: "*uid*"
    applies_to: [excel, vector]

  # Vector schema from STAC Land Use Change: Cropping reduction table:columns.
  - name: degradation_vector_schema_present
    type: required_any_field_pattern
    value:
      - "f_ba"
      - "f_bu"
      - "f_f"
      - "f_sc"
      - "total_deg"
    applies_to: [vector]

  # Excel schema from stats-generator change_detection_degradation sheet.
  - name: degradation_excel_schema_present
    type: required_any_field_pattern
    value:
      - "farm_to_barren_area_in_ha"
      - "farm_to_built_up_area_in_ha"
      - "farm_to_farm_area_in_ha"
      - "farm_to_scrub_land_area_in_ha"
      - "total_degradation_area_in_ha"
    applies_to: [excel]

  - name: degradation_vector_numeric_type
    type: data_type
    field_pattern: "*"
    expected_type: numeric
    exclude_field_patterns: ["*uid*", "the_geom", "geometry"]
    allow_missing_fields: true
    applies_to: [vector]

  - name: degradation_excel_numeric_type
    type: data_type
    field_pattern: "*_area_in_ha"
    expected_type: numeric
    allow_missing_fields: true
    applies_to: [excel]

  - name: degradation_vector_area_min
    type: min_value
    field_pattern: "*"
    value: 0
    exclude_field_patterns: ["*uid*", "the_geom", "geometry"]
    allow_missing_fields: true
    applies_to: [vector]

  - name: degradation_excel_area_min
    type: min_value
    field_pattern: "*_area_in_ha"
    value: 0
    allow_missing_fields: true
    applies_to: [excel]
