layer_name: terrain
sheet_names:
  - terrain

rules:
  - name: terrain_uid_not_null
    applies_to: [excel, vector]
    type: not_null
    field_pattern: "*uid*"

  - name: terrain_area_in_ha_type
    applies_to: [excel, vector]
    type: data_type
    fields:
      - area_in_ha
    expected_type: numeric
    allow_missing_fields: true

  - name: terrain_area_in_ha_min
    applies_to: [excel, vector]
    type: min_value
    fields:
      - area_in_ha
    value: 0
    allow_missing_fields: true

  - name: terrain_vector_schema_present
    applies_to: [vector]
    type: required_any_field_pattern
    value:
      - "terrainClusters"
      - "*_area"

  - name: terrain_vector_cluster_id_allowed_values
    applies_to: [vector]
    type: allowed_values
    value: [-1, 0, 1, 2, 3]
    fields:
      - terrainClusters
    allow_missing_fields: true

  - name: terrain_vector_percent_type
    applies_to: [vector]
    type: data_type
    field_pattern: "*_area"
    expected_type: numeric
    allow_missing_fields: true

  - name: terrain_vector_percent_min
    applies_to: [vector]
    type: min_value
    field_pattern: "*_area"
    value: 0
    allow_missing_fields: true

  - name: terrain_vector_percent_max
    applies_to: [vector]
    type: max_value
    field_pattern: "*_area"
    value: 100
    allow_missing_fields: true

  - name: terrain_excel_schema_present
    applies_to: [excel]
    type: required_any_field_pattern
    value:
      - "terrain_cluster_id"
      - "terrain_description"
      - "*_area_percent"

  - name: terrain_excel_percent_type
    applies_to: [excel]
    type: data_type
    field_pattern: "*_area_percent"
    expected_type: numeric
    allow_missing_fields: true

  - name: terrain_excel_percent_min
    applies_to: [excel]
    type: min_value
    field_pattern: "*_area_percent"
    value: 0
    allow_missing_fields: true

  - name: terrain_excel_percent_max
    applies_to: [excel]
    type: max_value
    field_pattern: "*_area_percent"
    value: 100
    allow_missing_fields: true
