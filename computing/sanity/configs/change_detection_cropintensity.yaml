layer_name: change_detection_cropintensity
sheet_names:
  - change_detection_cropintensity

rules:
  # Common identifier check. Vector uses uid; Excel export uses UID.
  - name: cropintensity_change_uid_not_null
    type: not_null
    field_pattern: "*uid*"
    applies_to: [excel, vector]

  # Vector schema from STAC Land Use Change: Cropping intensity table:columns.
  # Labels are fixed in change_detection_vector(_local).py, so every one is
  # required: a layer missing one class would otherwise pass.
  - name: cropintensity_change_vector_schema_present
    type: required_fields
    value:
      - "si_si"
      - "si_do"
      - "si_tr"
      - "do_si"
      - "do_do"
      - "do_tr"
      - "tr_si"
      - "tr_do"
      - "tr_tr"
    applies_to: [vector]

  # The total-change column is "total_change" in current layers and
  # "total_chan" in old shapefile-era layers; the Excel export reads either.
  - name: cropintensity_change_vector_total_present
    type: required_any_field_pattern
    value:
      - "total_chan*"
    applies_to: [vector]

  # Excel schema from stats-generator change_detection_cropintensity sheet.
  # The export writes every column even when the vector lacks the source
  # field (properties.get(..., None)), so the Excel not-null check below is
  # what catches a missing vector class here.
  - name: cropintensity_change_excel_schema_present
    type: required_fields
    value:
      - "single_to_single_area_in_ha"
      - "single_to_double_area_in_ha"
      - "single_to_triple_area_in_ha"
      - "double_to_single_area_in_ha"
      - "double_to_double_area_in_ha"
      - "double_to_triple_area_in_ha"
      - "triple_to_single_area_in_ha"
      - "triple_to_double_area_in_ha"
      - "triple_to_triple_area_in_ha"
      - "total_change_crop_intensity_area_in_ha"
    applies_to: [excel]

  # Vector area fields, listed explicitly: MWS layers in some states also carry
  # watershed code strings (bacode, sbcode, wsconc) that are not areas.
  # Areas are hectares (pixelArea * 0.0001), so never negative.
  - name: cropintensity_change_vector_numeric_type
    type: data_type
    fields:
      - "area_in_ha"
      - "si_si"
      - "si_do"
      - "si_tr"
      - "do_si"
      - "do_do"
      - "do_tr"
      - "tr_si"
      - "tr_do"
      - "tr_tr"
      - "total_change"
      - "total_chan"
    expected_type: numeric
    allow_missing_fields: true
    applies_to: [vector]

  - name: cropintensity_change_vector_area_not_null
    type: not_null
    fields:
      - "area_in_ha"
      - "si_si"
      - "si_do"
      - "si_tr"
      - "do_si"
      - "do_do"
      - "do_tr"
      - "tr_si"
      - "tr_do"
      - "tr_tr"
      - "total_change"
      - "total_chan"
    allow_missing_fields: true
    applies_to: [vector]

  - name: cropintensity_change_vector_area_min
    type: min_value
    fields:
      - "area_in_ha"
      - "si_si"
      - "si_do"
      - "si_tr"
      - "do_si"
      - "do_do"
      - "do_tr"
      - "tr_si"
      - "tr_do"
      - "tr_tr"
      - "total_change"
      - "total_chan"
    value: 0
    allow_missing_fields: true
    applies_to: [vector]

  # Excel area fields, including the MWS area_in_ha.
  - name: cropintensity_change_excel_numeric_type
    type: data_type
    field_pattern: "*area_in_ha"
    expected_type: numeric
    applies_to: [excel]

  - name: cropintensity_change_excel_area_not_null
    type: not_null
    field_pattern: "*area_in_ha"
    applies_to: [excel]

  - name: cropintensity_change_excel_area_min
    type: min_value
    field_pattern: "*area_in_ha"
    value: 0
    applies_to: [excel]
