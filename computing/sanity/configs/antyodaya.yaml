layer_name: antyodaya
sheet_names:
  - antyodaya

rules:
  # Source: stats-generator village-level Antyodaya export.
  - name: antyodaya_village_id_not_null
    applies_to: [excel, vector]
    type: not_null
    field: village_id

  - name: antyodaya_schema_present
    applies_to: [excel, vector]
    type: required_any_field_pattern
    value:
      - "*_cluster"
      - "*_value"
      - "total_hhd"

  - name: antyodaya_numeric_min
    applies_to: [excel, vector]
    type: min_value
    field_pattern: "total*"
    value: 0
    allow_missing_fields: true
