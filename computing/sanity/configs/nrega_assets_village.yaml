layer_name: nrega_assets_village
sheet_names:
  - nrega_assets_village

rules:
  # Source: stats-generator fetch_village_asset_count and
  # create_excel_village_nrega_assets, which join NREGA asset points to
  # panchayat_boundaries villages and count assets per vill_id, category and
  # creation year. Excel only: prod has no vector layer for this sheet.

  # Village key and the count columns.
  - name: nrega_village_schema_present
    applies_to: [excel]
    type: required_fields
    value: [vill_id, vill_name]

  - name: nrega_village_count_present
    applies_to: [excel]
    type: required_any_field_pattern
    value: ["*_count_*"]

  - name: nrega_village_id_not_null
    applies_to: [excel]
    type: not_null
    field: vill_id

  - name: nrega_village_name_not_null
    applies_to: [excel]
    type: not_null
    field: vill_name

  # 0 is the admin layer's "no census village" placeholder, not a village.
  - name: nrega_village_id_min
    applies_to: [excel]
    type: min_value
    field: vill_id
    value: 1

  # Asset counts are non-negative numbers.
  - name: nrega_village_count_type
    applies_to: [excel]
    type: data_type
    field_pattern: "*_count_*"
    expected_type: numeric

  - name: nrega_village_count_min
    applies_to: [excel]
    type: min_value
    field_pattern: "*_count_*"
    value: 0
