layer_name: nrega_assets_village
sheet_names:
  - nrega_assets_village

rules:
  # Source: STAC NREGA Works vector metadata and village-level Excel export.
  - name: nrega_village_id_not_null
    type: not_null
    field: vill_id

  - name: nrega_village_name_not_null
    type: not_null
    field: vill_name

  - name: nrega_village_count_type
    type: data_type
    field_pattern: "*_count_*"
    expected_type: numeric
    allow_missing_fields: true

  - name: nrega_village_count_min
    type: min_value
    field_pattern: "*_count_*"
    value: 0
    allow_missing_fields: true
