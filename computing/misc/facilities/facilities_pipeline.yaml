name: facilities
title: Facilities and Village Service Proximity
description: >
  Live local facilities inventory and nearest-service pipeline built from
  cs_pan_india_facilities.gpkg and cs_admin_standard.gpkg.

sources:
  admin_gpkg: data/admin-boundary/cs_admin_standard.gpkg
  admin_layer: cs_admin_standard
  facilities_gpkg: data/facilities/outputs/cs_pan_india_facilities.gpkg
  facilities_layer: facilities
  taxonomy_table: facility_taxonomy
  classification_yaml: computing/misc/facilities/facility_classifications.yaml

output:
  root: data/facilities/outputs/local_pipeline
  layer_prefix: facilities
  inventory_layer: facilities_inventory
  nearest_layer: facilities_nearest
  village_service_layer: facilities_village_service
  geoserver_workspace: facilities_proximity

default_outputs:
  mode: focused
  gpkg: true
  csv: false
  focused_csv: true
  verbose_csv: false
  excel_ready_csv: true
  readme: true
  eda: true
  stac: true
  geoserver: true

output_contract:
  l2_distance_columns:
    essential_education: essential_education_cat_distance_km
    higher_education: higher_education_cat_distance_km
    essential_health: essential_health_cat_distance_km
    advanced_health: advanced_health_cat_distance_km
    essential_services: essential_services_cat_distance_km
    financial_inclusion: financial_inclusion_cat_distance_km
    apmc_access: apmc_market_cat_distance_km
    post_harvest: post_harvest_cat_distance_km
    cooperative: cooperative_societies_cat_distance_km
    livestock: dairy_livestock_cat_distance_km
    agri_support_infra: agri_support_infra_cat_distance_km
  excel_ready_columns:
    - index
    - state_id
    - district_id
    - tehsil_id
    - village_id
    - state_name
    - district_name
    - tehsil_name
    - village_name
    - essential_education_cat_distance_km
    - nearest_school_primary
