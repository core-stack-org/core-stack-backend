  supplemental_expansion_degrees: 2.0
  earth_radius_km: 6371.0088

facility_columns:
  - facility_uid
  - facility_name
  - facility_code
  - latitude
  - longitude
  - class_l1_domain
  - class_l2_filter_group
  - class_l3_facility_class
  - class_l4_facility_subtype
  - class_k1
