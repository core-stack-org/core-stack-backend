      - "is_soil_testing_centre_available"
      - "total_no_of_farmers"
      - "total_no_of_farmers_add_fert_in_soil_as_per_report"
      - "total_no_of_farmers_received_benefit_under_pmfby"
      - "total_no_of_farmers_registered_under_pmkpy"
    raw_to_category_maps: |
      RAW::is_fertilizer_shop_available, is_govt_seed_centre_available, is_soil_testing_centre_available -> DERIVED::agri_inputs_availability_score -> FEATURE::agri_inputs_availability_feature -> CATEGORY::agriculture_support_services_category -> CATEGORY_CLUSTER::agriculture_support_services_category_cluster
      RAW::total_no_of_farmers, total_no_of_farmers_received_benefit_under_pmfby, total_no_of_farmers_registered_under_pmkpy -> DERIVED::agri_risk_support_score -> FEATURE::agri_risk_support_feature -> CATEGORY::agriculture_support_services_category -> CATEGORY_CLUSTER::agriculture_support_services_category_cluster
      RAW::total_no_of_farmers, total_no_of_farmers_add_fert_in_soil_as_per_report -> DERIVED::none -> FEATURE::soil_testing_adoption_feature -> CATEGORY::agriculture_support_services_category -> CATEGORY_CLUSTER::agriculture_support_services_category_cluster
    calculations_formulae: |
      CALC::agri_inputs_availability_score := mean(soil_testing_centre_available, fertilizer_shop_available, government_seed_centre_available); FORMULA::mean(soil_testing_centre_available, fertilizer_shop_available, government_seed_centre_available)
      CALC::agri_inputs_availability_feature := normalize(agri_inputs_availability_score)
      CALC::agri_risk_support_score := mean(pmkpy_registration_coverage, crop_insurance_coverage); FORMULA::mean(clipped(total_no_of_farmers_registered_under_pmkpy / total_no_of_farmers), clipped(total_no_of_farmers_received_benefit_under_pmfby / total_no_of_farmers))
      CALC::agri_risk_support_feature := normalize(agri_risk_support_score)
      CALC::soil_testing_adoption_feature := normalize(total_no_of_farmers_add_fert_in_soil_as_per_report / total_no_of_farmers)
      CALC::agriculture_support_services_category := mean(feature_class_score(agri_inputs_availability_feature, agri_risk_support_feature, soil_testing_adoption_feature)); CLASS_SCORE::Low=0, Medium=0.5, High=1; FINAL_CLASS::MiniBatchKMeans category classification
