categories:
  - category: "Institutionalization"
    village_cluster_share: "Low: 288,571 (45.7%); Medium: 229,884 (36.4%); High: 112,794 (17.9%)"
    constituent_features:
      - "shg_pen_feature::SHG Penetration"
      - "shg_fed_feature::SHG Federation"
      - "pg_pen_feature::PG Penetration"
      - "fpo_feature::FPO/PACS Strength"
    raw_columns_used:
      - "availability_of_fpos_pacs"
      - "total_hhd"
      - "total_hhd_mobilized_into_pg"
      - "total_hhd_mobilized_into_shg"
      - "total_no_of_shg_promoted"
      - "total_shg"
    raw_to_category_maps: |
      RAW::total_hhd, total_hhd_mobilized_into_shg -> DERIVED::none -> FEATURE::shg_pen_feature -> CATEGORY::institutionalization_category -> CATEGORY_CLUSTER::institutionalization_category_cluster
      RAW::total_no_of_shg_promoted, total_shg -> DERIVED::none -> FEATURE::shg_fed_feature -> CATEGORY::institutionalization_category -> CATEGORY_CLUSTER::institutionalization_category_cluster
      RAW::total_hhd, total_hhd_mobilized_into_pg -> DERIVED::none -> FEATURE::pg_pen_feature -> CATEGORY::institutionalization_category -> CATEGORY_CLUSTER::institutionalization_category_cluster
      RAW::availability_of_fpos_pacs -> DERIVED::farmers_collective_score -> FEATURE::fpo_feature -> CATEGORY::institutionalization_category -> CATEGORY_CLUSTER::institutionalization_category_cluster
    calculations_formulae: |
      CALC::shg_pen_feature := normalize(total_hhd_mobilized_into_shg / total_hhd)
      CALC::shg_fed_feature := normalize(total_no_of_shg_promoted / total_shg)
      CALC::pg_pen_feature := normalize(total_hhd_mobilized_into_pg / total_hhd)
      CALC::farmers_collective_score := ordinal_map(availability_of_fpos_pacs); FORMULA::FPO=1, PACS=1, both FPO and PACS=2, none=0; normalized during feature scoring
      CALC::fpo_feature := normalize(farmers_collective_score)
      CALC::institutionalization_category := mean(feature_class_score(shg_pen_feature, shg_fed_feature, pg_pen_feature, fpo_feature)); CLASS_SCORE::Low=0, Medium=0.5, High=1; FINAL_CLASS::MiniBatchKMeans category classification
  - category: "Social Protection"
    village_cluster_share: "Low: 216,650 (34.3%); Medium: 262,915 (41.6%); High: 151,684 (24.0%)"
    constituent_features:
      - "pds_util_feature::PDS Utilization"
      - "bpl_cov_feature::BPL Coverage"
      - "nfsa_cov_feature::NFSA Coverage"
      - "pension_cov_feature::Pension Coverage"
    raw_columns_used:
      - "gp_total_hhd_eligible_under_nfsa"
      - "gp_total_hhd_receiving_food_grains_from_fps"
      - "total_hhd"
      - "total_hhd_availing_pension_under_nsap"
      - "total_hhd_having_bpl_cards"
    raw_to_category_maps: |
      RAW::gp_total_hhd_eligible_under_nfsa, gp_total_hhd_receiving_food_grains_from_fps -> DERIVED::none -> FEATURE::pds_util_feature -> CATEGORY::social_protection_category -> CATEGORY_CLUSTER::social_protection_category_cluster
      RAW::total_hhd, total_hhd_having_bpl_cards -> DERIVED::none -> FEATURE::bpl_cov_feature -> CATEGORY::social_protection_category -> CATEGORY_CLUSTER::social_protection_category_cluster
      RAW::gp_total_hhd_eligible_under_nfsa, total_hhd -> DERIVED::none -> FEATURE::nfsa_cov_feature -> CATEGORY::social_protection_category -> CATEGORY_CLUSTER::social_protection_category_cluster
      RAW::total_hhd, total_hhd_availing_pension_under_nsap -> DERIVED::none -> FEATURE::pension_cov_feature -> CATEGORY::social_protection_category -> CATEGORY_CLUSTER::social_protection_category_cluster
    calculations_formulae: |
      CALC::pds_util_feature := normalize(gp_total_hhd_receiving_food_grains_from_fps / gp_total_hhd_eligible_under_nfsa)
      CALC::bpl_cov_feature := normalize(total_hhd_having_bpl_cards / total_hhd)
      CALC::nfsa_cov_feature := normalize(gp_total_hhd_eligible_under_nfsa / total_hhd)
      CALC::pension_cov_feature := normalize(total_hhd_availing_pension_under_nsap / total_hhd)
      CALC::social_protection_category := mean(feature_class_score(pds_util_feature, bpl_cov_feature, nfsa_cov_feature, pension_cov_feature)); CLASS_SCORE::Low=0, Medium=0.5, High=1; FINAL_CLASS::MiniBatchKMeans category classification
  - category: "Civic Infrastructure"
    village_cluster_share: "Low: 284,571 (45.1%); Medium: 243,967 (38.6%); High: 102,711 (16.3%)"
    constituent_features:
      - "panchayat_bhawan_feature::Panchayat Bhawan"
      - "post_office_feature::Post Office Availability"
      - "rep_training_feature::Representative Training"
      - "rep_orientation_feature::Representative Orientation"
      - "info_board_feature::Public Information Board"
      - "public_library_feature::Public Library Availability"
    raw_columns_used:
      - "availability_of_panchayat_bhawan"
      - "availability_of_public_information_board"
      - "availability_of_public_library"
      - "is_post_office_available"
      - "total_no_of_elect_rep_oriented_under_rgsa"
      - "total_no_of_elect_rep_undergone_training_under_rgsa"
      - "total_no_of_elected_representatives"
    raw_to_category_maps: |
      RAW::availability_of_panchayat_bhawan -> DERIVED::none -> FEATURE::panchayat_bhawan_feature -> CATEGORY::civic_infrastructure_category -> CATEGORY_CLUSTER::civic_infrastructure_category_cluster
      RAW::is_post_office_available -> DERIVED::none -> FEATURE::post_office_feature -> CATEGORY::civic_infrastructure_category -> CATEGORY_CLUSTER::civic_infrastructure_category_cluster
      RAW::total_no_of_elect_rep_undergone_training_under_rgsa, total_no_of_elected_representatives -> DERIVED::none -> FEATURE::rep_training_feature -> CATEGORY::civic_infrastructure_category -> CATEGORY_CLUSTER::civic_infrastructure_category_cluster
      RAW::total_no_of_elect_rep_oriented_under_rgsa, total_no_of_elected_representatives -> DERIVED::none -> FEATURE::rep_orientation_feature -> CATEGORY::civic_infrastructure_category -> CATEGORY_CLUSTER::civic_infrastructure_category_cluster
      RAW::availability_of_public_information_board -> DERIVED::none -> FEATURE::info_board_feature -> CATEGORY::civic_infrastructure_category -> CATEGORY_CLUSTER::civic_infrastructure_category_cluster
      RAW::availability_of_public_library -> DERIVED::none -> FEATURE::public_library_feature -> CATEGORY::civic_infrastructure_category -> CATEGORY_CLUSTER::civic_infrastructure_category_cluster
    calculations_formulae: |
      CALC::panchayat_bhawan_feature := binary_presence(availability_of_panchayat_bhawan)
      CALC::post_office_feature := binary_presence(is_post_office_available)
      CALC::rep_training_feature := normalize(total_no_of_elect_rep_undergone_training_under_rgsa / total_no_of_elected_representatives)
      CALC::rep_orientation_feature := normalize(total_no_of_elect_rep_oriented_under_rgsa / total_no_of_elected_representatives)
      CALC::info_board_feature := binary_presence(availability_of_public_information_board)
      CALC::public_library_feature := binary_presence(availability_of_public_library)
      CALC::civic_infrastructure_category := mean(feature_class_score(panchayat_bhawan_feature, post_office_feature, rep_training_feature, rep_orientation_feature, info_board_feature, public_library_feature)); CLASS_SCORE::Low=0, Medium=0.5, High=1; FINAL_CLASS::MiniBatchKMeans category classification
  - category: "Financial Inclusion"
    village_cluster_share: "Low: 400,652 (63.5%); Medium: 149,809 (23.7%); High: 80,788 (12.8%)"
    constituent_features:
      - "bank_feature::Bank Availability"
      - "atm_feature::ATM Availability"
      - "bank_correspondent_feature::Bank Correspondent"
      - "shg_credit_feature::SHG Credit Access"
      - "jan_dhan_pen_feature::Jan Dhan Penetration"
    raw_columns_used:
      - "is_atm_available"
      - "is_bank_available"
      - "is_bank_buss_correspondent_with_internet"
      - "total_hhd"
      - "total_hhd_availing_pmjdy_bank_ac"
      - "total_shg"
      - "total_shg_accessed_bank_loans"
    raw_to_category_maps: |
      RAW::is_bank_available -> DERIVED::none -> FEATURE::bank_feature -> CATEGORY::financial_inclusion_category -> CATEGORY_CLUSTER::financial_inclusion_category_cluster
      RAW::is_atm_available -> DERIVED::none -> FEATURE::atm_feature -> CATEGORY::financial_inclusion_category -> CATEGORY_CLUSTER::financial_inclusion_category_cluster
      RAW::is_bank_buss_correspondent_with_internet -> DERIVED::none -> FEATURE::bank_correspondent_feature -> CATEGORY::financial_inclusion_category -> CATEGORY_CLUSTER::financial_inclusion_category_cluster
      RAW::total_shg, total_shg_accessed_bank_loans -> DERIVED::none -> FEATURE::shg_credit_feature -> CATEGORY::financial_inclusion_category -> CATEGORY_CLUSTER::financial_inclusion_category_cluster
      RAW::total_hhd, total_hhd_availing_pmjdy_bank_ac -> DERIVED::none -> FEATURE::jan_dhan_pen_feature -> CATEGORY::financial_inclusion_category -> CATEGORY_CLUSTER::financial_inclusion_category_cluster
    calculations_formulae: |
      CALC::bank_feature := binary_presence(is_bank_available)
      CALC::atm_feature := binary_presence(is_atm_available)
      CALC::bank_correspondent_feature := binary_presence(is_bank_buss_correspondent_with_internet)
      CALC::shg_credit_feature := normalize(total_shg_accessed_bank_loans / total_shg)
      CALC::jan_dhan_pen_feature := normalize(total_hhd_availing_pmjdy_bank_ac / total_hhd)
      CALC::financial_inclusion_category := mean(feature_class_score(bank_feature, atm_feature, bank_correspondent_feature, shg_credit_feature, jan_dhan_pen_feature)); CLASS_SCORE::Low=0, Medium=0.5, High=1; FINAL_CLASS::MiniBatchKMeans category classification
  - category: "Energy Access"
    village_cluster_share: "Low: 255,875 (40.5%); Medium: 150,514 (23.8%); High: 224,860 (35.6%)"
    constituent_features:
      - "electrification_rate_feature::Electrification Rate"
      - "electricity_supply_to_msme_feature::Electricity Supply to MSME"
      - "clean_energy_penetration_feature::Clean Energy Penetration"
    raw_columns_used:
      - "availability_of_elect_supply_to_msme"
      - "availablility_hours_of_domestic_electricity"
      - "total_hhd"
      - "total_hhd_with_clean_energy"
    raw_to_category_maps: |
      RAW::availablility_hours_of_domestic_electricity -> DERIVED::domestic_electricity_hours_score -> FEATURE::electrification_rate_feature -> CATEGORY::energy_access_category -> CATEGORY_CLUSTER::energy_access_category_cluster
      RAW::availability_of_elect_supply_to_msme -> DERIVED::none -> FEATURE::electricity_supply_to_msme_feature -> CATEGORY::energy_access_category -> CATEGORY_CLUSTER::energy_access_category_cluster
      RAW::total_hhd, total_hhd_with_clean_energy -> DERIVED::none -> FEATURE::clean_energy_penetration_feature -> CATEGORY::energy_access_category -> CATEGORY_CLUSTER::energy_access_category_cluster
    calculations_formulae: |
      CALC::domestic_electricity_hours_score := ordinal_map(availablility_hours_of_domestic_electricity); FORMULA::1-4 hrs=0.25, 4-8 hrs=0.50, 8-12 hrs=0.75, >12 hrs=1.00, no electricity=0.00
      CALC::electrification_rate_feature := normalize(domestic_electricity_hours_score)
      CALC::electricity_supply_to_msme_feature := binary_presence(availability_of_elect_supply_to_msme)
      CALC::clean_energy_penetration_feature := normalize(total_hhd_with_clean_energy / total_hhd)
      CALC::energy_access_category := mean(feature_class_score(electrification_rate_feature, electricity_supply_to_msme_feature, clean_energy_penetration_feature)); CLASS_SCORE::Low=0, Medium=0.5, High=1; FINAL_CLASS::MiniBatchKMeans category classification
  - category: "Road Connectivity"
    village_cluster_share: "Low: 90,511 (14.3%); Medium: 275,772 (43.7%); High: 264,966 (42.0%)"
    constituent_features:
      - "all_weather_road_feature::All-Weather Road Connection"
      - "internal_pucca_road_feature::Internal Pucca Road Quality"
      - "public_transport_feature::Public Transport Availability"
      - "railway_station_feature::Railway Station Availability"
    raw_columns_used:
      - "availability_of_internal_pucca_road"
      - "availability_of_public_transport"
      - "availability_of_railway_station"
      - "is_village_connected_to_all_weather_road"
    raw_to_category_maps: |
      RAW::is_village_connected_to_all_weather_road -> DERIVED::none -> FEATURE::all_weather_road_feature -> CATEGORY::road_connectivity_category -> CATEGORY_CLUSTER::road_connectivity_category_cluster
      RAW::availability_of_internal_pucca_road -> DERIVED::internal_pucca_road_quality_score -> FEATURE::internal_pucca_road_feature -> CATEGORY::road_connectivity_category -> CATEGORY_CLUSTER::road_connectivity_category_cluster
      RAW::availability_of_public_transport -> DERIVED::public_transport -> FEATURE::public_transport_feature -> CATEGORY::road_connectivity_category -> CATEGORY_CLUSTER::road_connectivity_category_cluster
      RAW::availability_of_railway_station -> DERIVED::none -> FEATURE::railway_station_feature -> CATEGORY::road_connectivity_category -> CATEGORY_CLUSTER::road_connectivity_category_cluster
    calculations_formulae: |
      CALC::all_weather_road_feature := binary_presence(is_village_connected_to_all_weather_road)
      CALC::internal_pucca_road_quality_score := ordinal_map(availability_of_internal_pucca_road); FORMULA::fully covered=1.00, partially covered=0.50, not covered=0.00
      CALC::internal_pucca_road_feature := normalize(internal_pucca_road_quality_score)
      CALC::public_transport_feature := normalize(public_transport)
      CALC::railway_station_feature := binary_presence(availability_of_railway_station)
      CALC::road_connectivity_category := mean(feature_class_score(all_weather_road_feature, internal_pucca_road_feature, public_transport_feature, railway_station_feature)); CLASS_SCORE::Low=0, Medium=0.5, High=1; FINAL_CLASS::MiniBatchKMeans category classification
  - category: "Housing Quality"
    village_cluster_share: "Low: 225,541 (35.7%); Medium: 286,500 (45.4%); High: 119,208 (18.9%)"
    constituent_features:
      - "pucca_housing_rate_feature::Pucca Housing Rate"
      - "housing_scheme_coverage_feature::Housing Scheme Coverage"
      - "pmay_demand_met_feature::PMAY Demand Met"
      - "ujjwala_coverage_feature::Ujjwala Coverage"
    raw_columns_used:
      - "total_hhd"
      - "total_hhd_availing_pmuy_benefits"
      - "total_hhd_got_benefit_under_state_housing_scheme"
      - "total_hhd_have_got_pmay_house"
      - "total_hhd_in_pmay_permanent_wait_list"
      - "total_hhd_with_kuccha_wall_kuccha_roof"
    raw_to_category_maps: |
      RAW::total_hhd, total_hhd_with_kuccha_wall_kuccha_roof -> DERIVED::pucca_housing_rate_score -> FEATURE::pucca_housing_rate_feature -> CATEGORY::housing_quality_category -> CATEGORY_CLUSTER::housing_quality_category_cluster
      RAW::total_hhd, total_hhd_got_benefit_under_state_housing_scheme, total_hhd_have_got_pmay_house -> DERIVED::housing_scheme_coverage_score -> FEATURE::housing_scheme_coverage_feature -> CATEGORY::housing_quality_category -> CATEGORY_CLUSTER::housing_quality_category_cluster
      RAW::total_hhd_have_got_pmay_house, total_hhd_in_pmay_permanent_wait_list -> DERIVED::pmay_demand_met_score -> FEATURE::pmay_demand_met_feature -> CATEGORY::housing_quality_category -> CATEGORY_CLUSTER::housing_quality_category_cluster
      RAW::total_hhd, total_hhd_availing_pmuy_benefits -> DERIVED::ujjwala_coverage_score -> FEATURE::ujjwala_coverage_feature -> CATEGORY::housing_quality_category -> CATEGORY_CLUSTER::housing_quality_category_cluster
    calculations_formulae: |
      CALC::pucca_housing_rate_score := 1.0 - min(1.0, total_hhd_with_kuccha_wall_kuccha_roof / total_hhd); INVERSE::higher score means lower burden/rate
      CALC::pucca_housing_rate_feature := normalize(pucca_housing_rate_score)
      CALC::housing_scheme_coverage_score := weighted_mean(pmay_and_state_housing_benefit_share); FORMULA::min(1.0, (total_hhd_have_got_pmay_house + total_hhd_got_benefit_under_state_housing_scheme) / total_hhd)
      CALC::housing_scheme_coverage_feature := normalize(housing_scheme_coverage_score)
      CALC::pmay_demand_met_score := weighted_mean(pmay_houses_over_pmay_houses_plus_waitlist); FORMULA::min(1.0, total_hhd_have_got_pmay_house / (total_hhd_have_got_pmay_house + total_hhd_in_pmay_permanent_wait_list))
      CALC::pmay_demand_met_feature := normalize(pmay_demand_met_score)
      CALC::ujjwala_coverage_score := min(1.0, total_hhd_availing_pmuy_benefits / total_hhd)
      CALC::ujjwala_coverage_feature := normalize(ujjwala_coverage_score)
      CALC::housing_quality_category := mean(feature_class_score(pucca_housing_rate_feature, housing_scheme_coverage_feature, pmay_demand_met_feature, ujjwala_coverage_feature)); CLASS_SCORE::Low=0, Medium=0.5, High=1; FINAL_CLASS::MiniBatchKMeans category classification
  - category: "Maternal and Child Health"
    village_cluster_share: "Low: 103,980 (16.5%); Medium: 213,177 (33.8%); High: 314,092 (49.8%)"
    constituent_features:
      - "awc_infra_enrollment_coverage_feature::AWC Infrastructure and Enrollment Coverage"
      - "maternal_health_care_access_feature::Maternal Health and Care Access"
      - "child_nutrition_development_feature::Child Nutrition and Development"
      - "newborn_health_outcomes_feature::Newborn Health Outcomes"
      - "health_schemes_utilization_feature::Health Schemes Utilization"
    raw_columns_used:
      - "availability_of_mother_child_health_facilities"
      - "gp_total_no_of_beneficiaries_receiving_benefits_under_pmjay"
      - "gp_total_no_of_eligible_beneficiaries_under_pmjay"
      - "is_aanganwadi_centre_available"
      - "is_early_childhood_edu_provided_in_anganwadi"
      - "total_anemic_pregnant_women"
      - "total_childs_aged_0_to_3_years"
      - "total_childs_aged_0_to_3_years_immunized"
      - "total_childs_aged_0_to_3_years_reg_under_aanganwadi"
      - "total_childs_aged_3_to_6_years_reg_under_aanganwadi"
      - "total_childs_categorized_non_stunted_as_per_icds"
      - "total_female_child_age_bw_0_6"
      - "total_hhd"
      - "total_hhd_registered_under_pmjay"
      - "total_male_child_age_bw_0_6"
      - "total_no_of_beneficiaries_receiving_benefits_under_pmmvy"
      - "total_no_of_children_in_icds_cas"
      - "total_no_of_eligible_beneficiaries_under_pmmvy"
      - "total_no_of_lactating_mothers"
      - "total_no_of_lactating_mothers_receiving_services_under_icds"
      - "total_no_of_newly_born_children"
      - "total_no_of_newly_born_underweight_children"
      - "total_no_of_pregnant_women"
      - "total_no_of_pregnant_women_receiving_services_under_icds"
      - "total_no_of_registered_children_in_anganwadi"
      - "total_no_of_women_delivered_babies_at_hospitals_registered_asha"
      - "total_no_of_young_anemic_children_6_59_months_in_icds_cas"
      - "total_underweight_child_age_under_6_years"
    raw_to_category_maps: |
      RAW::availability_of_mother_child_health_facilities, is_aanganwadi_centre_available, is_early_childhood_edu_provided_in_anganwadi, total_childs_aged_0_to_3_years, total_childs_aged_0_to_3_years_reg_under_aanganwadi, total_childs_aged_3_to_6_years_reg_under_aanganwadi, total_female_child_age_bw_0_6, total_male_child_age_bw_0_6, total_no_of_children_in_icds_cas, total_no_of_registered_children_in_anganwadi -> DERIVED::awc_0_3_coverage_score, awc_3_6_coverage_score, awc_infra_enrollment_coverage_score, awc_total_enrollment_score, children_3_6_estimated, children_under_age_6, overall_awc_enrollment_score -> FEATURE::awc_infra_enrollment_coverage_feature -> CATEGORY::maternal_child_health_category -> CATEGORY_CLUSTER::maternal_child_health_category_cluster
      RAW::total_anemic_pregnant_women, total_no_of_lactating_mothers, total_no_of_lactating_mothers_receiving_services_under_icds, total_no_of_pregnant_women, total_no_of_pregnant_women_receiving_services_under_icds, total_no_of_women_delivered_babies_at_hospitals_registered_asha -> DERIVED::institutional_delivery_rate_score, lactating_service_coverage_score, maternal_anemia_score, maternal_health_care_access_score, pregnant_service_coverage_score -> FEATURE::maternal_health_care_access_feature -> CATEGORY::maternal_child_health_category -> CATEGORY_CLUSTER::maternal_child_health_category_cluster
      RAW::total_childs_aged_0_to_3_years, total_childs_aged_0_to_3_years_immunized, total_childs_categorized_non_stunted_as_per_icds, total_female_child_age_bw_0_6, total_male_child_age_bw_0_6, total_no_of_children_in_icds_cas, total_no_of_registered_children_in_anganwadi, total_no_of_young_anemic_children_6_59_months_in_icds_cas, total_underweight_child_age_under_6_years -> DERIVED::child_anemia_score, child_immunization_rate_score, child_nutrition_development_score, child_nutrition_score, child_stunting_score, children_under_age_6, stunted_children -> FEATURE::child_nutrition_development_feature -> CATEGORY::maternal_child_health_category -> CATEGORY_CLUSTER::maternal_child_health_category_cluster
      RAW::total_no_of_newly_born_children, total_no_of_newly_born_underweight_children -> DERIVED::newborn_health_score -> FEATURE::newborn_health_outcomes_feature -> CATEGORY::maternal_child_health_category -> CATEGORY_CLUSTER::maternal_child_health_category_cluster
      RAW::gp_total_no_of_beneficiaries_receiving_benefits_under_pmjay, gp_total_no_of_eligible_beneficiaries_under_pmjay, total_hhd, total_hhd_registered_under_pmjay, total_no_of_beneficiaries_receiving_benefits_under_pmmvy, total_no_of_eligible_beneficiaries_under_pmmvy -> DERIVED::ayushman_bharat_utilization_score, health_insurance_coverage_score, health_schemes_utilization_score, matru_vandana_utilization_score -> FEATURE::health_schemes_utilization_feature -> CATEGORY::maternal_child_health_category -> CATEGORY_CLUSTER::maternal_child_health_category_cluster
    calculations_formulae: |
      CALC::awc_0_3_coverage_score := min(1.0, total_childs_aged_0_to_3_years_reg_under_aanganwadi / total_childs_aged_0_to_3_years)
      CALC::children_under_age_6 := total_male_child_age_bw_0_6 + total_female_child_age_bw_0_6
      CALC::children_3_6_estimated := max(0, children_under_age_6 - total_childs_aged_0_to_3_years)
      CALC::awc_3_6_coverage_score := min(1.0, total_childs_aged_3_to_6_years_reg_under_aanganwadi / children_3_6_estimated)
      CALC::overall_awc_enrollment_score := min(1.0, total_no_of_children_in_icds_cas / children_under_age_6)
      CALC::awc_total_enrollment_score := min(1.0, total_no_of_registered_children_in_anganwadi / children_under_age_6)
      CALC::awc_infra_enrollment_coverage_score := mean(awc_available, mch_facility_available, ece_available, awc_0_3_coverage, awc_3_6_coverage, overall_awc_enrollment, awc_total_enrollment); FORMULA::mean(awc_available, mch_facility_available, ece_available, awc_0_3_coverage_score, awc_3_6_coverage_score, overall_awc_enrollment_score, awc_total_enrollment_score)
      CALC::awc_infra_enrollment_coverage_feature := normalize(awc_infra_enrollment_coverage_score)
      CALC::pregnant_service_coverage_score := min(1.0, total_no_of_pregnant_women_receiving_services_under_icds / total_no_of_pregnant_women)
      CALC::lactating_service_coverage_score := min(1.0, total_no_of_lactating_mothers_receiving_services_under_icds / total_no_of_lactating_mothers)
      CALC::maternal_anemia_score := 1.0 - min(1.0, total_anemic_pregnant_women / total_no_of_pregnant_women); INVERSE::higher score means lower burden/rate
      CALC::institutional_delivery_rate_score := min(1.0, total_no_of_women_delivered_babies_at_hospitals_registered_asha / total_no_of_pregnant_women)
      CALC::maternal_health_care_access_score := mean(pregnant_service_coverage, lactating_service_coverage, maternal_anemia_score, institutional_delivery_rate); FORMULA::mean(pregnant_service_coverage_score, lactating_service_coverage_score, maternal_anemia_score, institutional_delivery_rate_score)
      CALC::maternal_health_care_access_feature := normalize(maternal_health_care_access_score)
      CALC::child_immunization_rate_score := min(1.0, total_childs_aged_0_to_3_years_immunized / total_childs_aged_0_to_3_years)
      CALC::children_under_age_6 := total_male_child_age_bw_0_6 + total_female_child_age_bw_0_6
      CALC::child_nutrition_score := 1.0 - min(1.0, total_underweight_child_age_under_6_years / children_under_age_6); INVERSE::higher score means lower burden/rate
      CALC::stunted_children := max(0, total_no_of_registered_children_in_anganwadi - total_childs_categorized_non_stunted_as_per_icds)
      CALC::child_stunting_score := 1.0 - min(1.0, stunted_children / total_no_of_registered_children_in_anganwadi); INVERSE::higher score means lower burden/rate
      CALC::child_anemia_score := 1.0 - min(1.0, total_no_of_young_anemic_children_6_59_months_in_icds_cas / total_no_of_children_in_icds_cas); INVERSE::higher score means lower burden/rate; NULL_RULE::denominator<=0 is treated as NULL before feature scoring
      CALC::child_nutrition_development_score := mean(child_immunization_rate, child_nutrition_score, child_stunting_score, child_anemia_score); FORMULA::mean(child_immunization_rate_score, child_nutrition_score, child_stunting_score, child_anemia_score)
      CALC::child_nutrition_development_feature := normalize(child_nutrition_development_score)
