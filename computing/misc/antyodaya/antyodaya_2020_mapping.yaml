      CALC::health_schemes_utilization_score := mean(matru_vandana_utilization, health_insurance_coverage, ayushman_bharat_utilization); FORMULA::mean(matru_vandana_utilization_score, health_insurance_coverage_score, ayushman_bharat_utilization_score)
      CALC::health_schemes_utilization_feature := normalize(health_schemes_utilization_score)
