--- !Algorithm_Type
id: NREGA_Clip
name: NREGA_Clip
description: Clips the NREGA shapefile to the local watershed boundary.
params:
- name: state
  type: string
- name: district
  type: string
- name: block
  type: string
input_datasets:
- MWS_Boundaries
outputs:
- NREGA_Layer


--- !Algorithm_Type
id: LULC_Algorithm
name: LULC_Algorithm
description: Generates yearly LULC rasters (start_year to end_year) clipped to the
  local watershed boundary.
params:
- name: state
  type: string
- name: district
  type: string
- name: block
  type: string
- name: start_year
  type: integer
- name: end_year
  type: integer
input_datasets:
- MWS_Boundaries
outputs:
- LULC_Raster


--- !Algorithm_Type
id: LULC_Vectorization
name: LULC_Vectorization
description: Vectorizes the local LULC raster into per-MWS area statistics.
params:
- name: state
  type: string
- name: district
  type: string
- name: block
  type: string
- name: start_year
  type: integer
- name: end_year
  type: integer
input_datasets:
- LULC_Raster
outputs:
- LULC_Vector


--- !Algorithm_Type
id: Change_Detection
name: Change_Detection
description: Computes change-detection classes from local LULC rasters.
params:
- name: state
  type: string
- name: district
  type: string
- name: block
  type: string
- name: start_year
  type: integer
- name: end_year
  type: integer
input_datasets:
- MWS_Boundaries
outputs:
- Change_Detection_Asset


--- !Algorithm_Type
id: Change_Detection_Vector
name: Change_Detection_Vector
description: Vectorizes the local change-detection raster.
params:
- name: state
  type: string
- name: district
  type: string
- name: block
  type: string
- name: start_year
  type: integer
- name: end_year
  type: integer
input_datasets:
- Change_Detection_Asset
outputs:
- Change_Detection_Vector_Asset


--- !Algorithm_Type
id: Terrain_Algorithm
name: Terrain_Algorithm
description: Generates FABDEM terrain raster clipped to the local watershed boundary.
params:
- name: state
  type: string
- name: district
  type: string
- name: block
  type: string
input_datasets:
- MWS_Boundaries
outputs:
- Terrain_Raster


--- !Algorithm_Type
id: Terrain_Clusters
name: Terrain_Clusters
description: Generates terrain cluster vector per MWS from the local terrain raster.
params:
- name: state
  type: string
- name: district
  type: string
- name: block
  type: string
input_datasets:
- Terrain_Raster
outputs:
- Terrain_Vector


--- !Algorithm_Type
id: LULC_Terrain_Plain
name: LULC_Terrain_Plain
description: Computes LULC proportions on plain terrain clusters.
params:
- name: state
  type: string
- name: district
  type: string
- name: block
  type: string
- name: start_year
  type: integer
- name: end_year
  type: integer
input_datasets:
- Terrain_Raster
- LULC_Raster
outputs:
- LULC_Terrain_Plain_Asset


--- !Algorithm_Type
id: LULC_Terrain_Slope
name: LULC_Terrain_Slope
description: Computes LULC proportions on slope terrain clusters.
params:
- name: state
  type: string
- name: district
  type: string
- name: block
  type: string
- name: start_year
  type: integer
- name: end_year
  type: integer
input_datasets:
- Terrain_Raster
- LULC_Raster
outputs:
- LULC_Terrain_Slope_Asset


--- !Algorithm_Type
id: Cropping_Intensity
name: Cropping_Intensity
description: Derives cropping intensity from local LULC rasters.
params:
- name: state
  type: string
- name: district
  type: string
- name: block
  type: string
- name: start_year
  type: integer
- name: end_year
  type: integer
input_datasets:
- MWS_Boundaries
outputs:
- Cropping_Intensity_Asset


--- !Algorithm_Type
id: SWB_Layer
name: SWB_Layer
description: Generates the surface water body layer from precomputed local watershed
  geometry.
params:
- name: state
  type: string
- name: district
  type: string
- name: block
  type: string
- name: start_year
  type: integer
- name: end_year
  type: integer
- name: gee_account_id
  type: integer
input_datasets:
- MWS_Boundaries
outputs:
- SWB_Layer_Asset


--- !Algorithm_Type
id: ZOI
name: ZOI
description: Generates the Zone of Influence layer from the local SWB layer.
params:
- name: state
  type: string
- name: district
  type: string
- name: block
  type: string
- name: gee_account_id
  type: integer
input_datasets:
- SWB_Layer_Asset
outputs:
- ZOI_Asset


